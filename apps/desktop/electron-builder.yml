# electron-builder 打包配置（A1：壳 + 自带官方 Node + 后端整体）
#
# 关键设计：后端走 extraResources（真实文件系统），不进 app.asar ——
# 我们有 fs.stat 读附件、读 spill 路径这类动态文件访问，asar 的虚拟文件系统
# 只会制造问题，收益（省几百 MB 体积）不存在。
#
# npmRebuild: false 是 A1 的关键开关：三个原生模块全是 Node-API（ABI 稳定），
# 而且后端跑在自带的官方 Node 里，压根不需要按 Electron ABI 重编。

appId: com.payaso.agent
productName: PayasoAgent
copyright: Copyright © 2026 PayasoAgent

directories:
  output: release
  buildResources: build

# 只放壳自己的编译产物（main.js + sourcemap）
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/**"

extraResources:
  # 后端整体（scripts/stage-backend.mjs 生成：dist/ + web/dist/ + 生产 node_modules/）
  #
  # 注意 from 是 `.stage` 而不是 `.stage/app`：electron-builder 的 createFilter 会
  # 硬编码丢弃**根级** node_modules（"if (relative === 'node_modules') return false"），
  # 但允许嵌套的 node_modules。把来源提高一层，产物里的 app/node_modules 就成了
  # 嵌套路径，从而被完整复制进来。
  - from: .stage
    to: .
    filter:
      - "**/*"
      - "**/node_modules{,/**/*}"
  # A1：自带的官方 Node 运行时（scripts/fetch-node.mjs 生成）
  - from: runtime/bin/node
    to: runtime/bin/node

asar: true
npmRebuild: false

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # notarize 的配置形式待按 electron-builder v26 文档核对（本项目文档标注未验证）

dmg:
  title: PayasoAgent
  icon: build/icon.icns
  # 安装窗样式：背景图（660x400，深蓝渐变 + 箭头 + 提示语）
  #
  # 两个实测过的约束（读 dmg-builder 源码确认，别被 schema 文档误导）：
  # 1. 有背景图时窗口尺寸 = 图片**像素**尺寸（sips -g pixelWidth），配置里的
  #    window.width/height 在这条分支会被忽略 → 背景图必须按 1x 画（660x400），
  #    retina 下 Finder 放大显示，所以生成时 2x 超采样缩图保边缘。
  # 2. contents 里第一条省略 path = 打包出的 .app（dmg.js: "path is required,
  #    when omitted, appPath is used"）；x/y 是图标的**中心**、从窗口顶部往下量。
  background: build/dmg-background.png
  iconSize: 120
  iconTextSize: 14
  contents:
    - x: 180
      y: 190
      type: file
      name: PayasoAgent.app
    - x: 480
      y: 190
      type: link
      path: /Applications

publish: null
