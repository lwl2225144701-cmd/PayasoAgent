name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-updater:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install updater test dependencies
        run: |
          npm ci
          npm ci --prefix apps/desktop
      - name: Desktop type check
        run: npm run typecheck --prefix apps/desktop
      - name: Windows updater and process regression
        run: npx tsx tests/desktop-update.test.ts

  windows-update-candidate:
    if: github.event_name == 'pull_request' && contains(github.head_ref, 'windows-update')
    needs: windows-updater
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install candidate dependencies
        run: |
          npm ci
          npm ci --prefix web
          npm ci --prefix apps/desktop
      - name: Prepare desktop payload
        run: npm run desktop:setup
      - name: Build candidate installer without publishing
        run: npm run desktop:win
      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: PayasoAgent-Windows-update-candidate
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  build-and-test:
    # macOS runner：shell 沙箱（sandbox-exec）与 Keychain 相关套件均为 darwin 能力；
    # 沙箱不可用的环境下 shell 用例按 fail-closed 预期走 DENIED 分支。
    runs-on: macos-latest
    env:
      # test:host 需要真实 LLM；未配置 secret 时该步骤自动跳过（见下方 if）。
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Install desktop test dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --prefix apps/desktop

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint & format check (Biome)
        run: npx biome check .

      # 套件并发时共享 /private/tmp/payaso-shell（managed scratch 根）：v0.4.14 的
      # 两次发布跑里 flake 从 shell-execution 换到 shell-executor（scratch 目录被
      # 并发套件扰动/计数竞态）——CI 里串行跑，宁慢勿红；本地默认仍并发。
      - name: Deterministic test suites (no LLM)
        env:
          PAYASO_TEST_CONCURRENCY: '1'
        run: npm run test:all

      - name: Host integration tests (requires LLM credentials)
        if: env.OPENAI_API_KEY != ''
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          # test:host 通过 tsx --env-file=.env 读取配置，CI 中从 secrets 生成
          printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" > .env
          printf 'OPENAI_BASE_URL=%s\n' "${OPENAI_BASE_URL:-https://api.openai.com/v1}" >> .env
          printf 'OPENAI_MODEL=%s\n' "${OPENAI_MODEL:-gpt-4o-mini}" >> .env
          npm run test:host

      - name: Build distribution
        run: npm run build

      - name: Inspect npm package
        run: npm pack --ignore-scripts --dry-run
