name: Release (macOS DMG + Windows NSIS)

# 桌面客户端发布：在 GitHub 的 macOS runner 上打包 DMG，并挂到 Release 上。
#
# 为什么需要 CI：`hdiutil create` 在某些环境（如 Agent 沙箱）被禁用，DMG 打不出来；
# 而且发布产物本就不该在开发机上随手构建。这条 workflow 让「下载一个 dmg」成立。
#
# 触发方式：
#   推 tag   ：git tag v0.2.0 && git push origin v0.2.0   → 构建 + 直接建 Release
#   手动触发 ：Actions 页面 Run workflow，可只构建不上 Release（产物进 artifacts）
#
# 版本来源（三选一，优先级从高到低）：
#   1. workflow_dispatch 填的 version
#   2. tag 名去掉 v 前缀
#   3. apps/desktop/package.json 里现有的版本

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，例如 0.2.0）。留空则用 tag 或包内版本。'
        required: false
        type: string

permissions:
  contents: write # 创建 Release、上传产物

jobs:
  build-macos-dmg:
    runs-on: macos-latest # 与 ci.yml 保持一致；runner 上有 hdiutil，能打 DMG
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (root / web / desktop)
        run: |
          npm ci
          npm ci --prefix web
          npm ci --prefix apps/desktop

      # 别让带病的代码进发布包：先跑与 ci.yml 同级的检查
      - name: Type check
        run: npx tsc --noEmit

      - name: Lint & format check (Biome)
        run: npx biome check .

      - name: Deterministic test suites (no LLM)
        run: npm run test:all

      - name: Resolve release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          elif [ -n "$TAG_NAME" ] && [ "${TAG_NAME#v}" != "$TAG_NAME" ]; then
            V="${TAG_NAME#v}"          # v0.2.0 → 0.2.0
          else
            V="$(node -p "require('./apps/desktop/package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "→ 发布版本：$V"

      - name: Sync version into desktop package
        run: cd apps/desktop && PAYASO_RELEASE_VERSION=${{ steps.version.outputs.version }} node scripts/sync-version.mjs

      # 取官方 Node 运行时 + 生成图标 + 组装后端整体（需要网络）
      - name: Prepare desktop payload
        run: npm run desktop:setup

      - name: Package DMG & ZIP
        # 签名/公证凭据从 secrets 传入。注意：secret 未配时 GitHub Actions 展开成**空串**，
        # 而 electron-builder 的 getCscLink 对空串照单全收（chooseNotNull 不判空），随后
        # resolveCscLinkPath('') 解析成当前目录，报 "<目录> not a file"（坑 8，本地已复现）。
        # 所以必须把空变量彻底 unset —— "没配凭据"才真正等于"跳过签名"。
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD \
                   APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -z "$CSC_LINK" ]; then
            # 没配证书就明确不签名，不赌 runner 钥匙串里有什么
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run desktop:dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PayasoAgent-${{ steps.version.outputs.version }}-macOS
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: error

      # 只有 push tag 才建 Release；手动触发只出 artifact，避免误发版本
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PayasoAgent ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          fail_on_unmatched_files: true

      # Homebrew cask 自动 bump：改 version + DMG 的 sha256 后推回 main。
      # brew 通道 = 不花钱的「装完即用」（curl 下载不带 quarantine），见手账 §9。
      - name: Sync Homebrew cask
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG_SHA=$(shasum -a 256 apps/desktop/release/*.dmg | awk '{print $1}')
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/payasoagent.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${DMG_SHA}\"/" Casks/payasoagent.rb
          git add Casks/payasoagent.rb
          if git diff --cached --quiet; then
            echo "cask 无变化"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(cask): bump payasoagent to ${VERSION}"
            git push origin main
          fi

  # Windows 线：NSIS 安装器 + zip 便携包。质量门禁在 mac job（shell 沙箱套件是
  # darwin 能力），本 job 只出包。先未签名发布（SmartScreen 可"更多信息 → 仍要
  # 运行"跳过，能用）；SignPath（开源免费）签名后续接，见手账 §10。
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # 步骤脚本是 bash 语法（runner 自带 Git Bash）
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (root / web / desktop)
        run: |
          npm ci
          npm ci --prefix web
          npm ci --prefix apps/desktop

      - name: Type check
        run: npx tsc --noEmit

      - name: Resolve release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          elif [ -n "$TAG_NAME" ] && [ "${TAG_NAME#v}" != "$TAG_NAME" ]; then
            V="${TAG_NAME#v}"          # v0.3.0 → 0.3.0
          else
            V="$(node -p "require('./apps/desktop/package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "→ 发布版本：$V"

      - name: Sync version into desktop package
        run: cd apps/desktop && PAYASO_RELEASE_VERSION=${{ steps.version.outputs.version }} node scripts/sync-version.mjs

      - name: Prepare desktop payload
        run: npm run desktop:setup

      - name: Package NSIS installer & ZIP
        # WIN_CSC_* 为空也必须 unset —— 坑 8 的空串陷阱 Windows 同款
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          for v in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -n "${!v}" ] || unset "$v"
          done
          npm run desktop:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PayasoAgent-${{ steps.version.outputs.version }}-Windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PayasoAgent ${{ steps.version.outputs.version }}
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          fail_on_unmatched_files: true
