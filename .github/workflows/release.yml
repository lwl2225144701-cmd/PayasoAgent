name: Release (macOS DMG + Windows NSIS)

# 桌面客户端发布：在 GitHub 的 macOS runner 上打包 DMG，并挂到 Release 上。
#
# 为什么需要 CI：`hdiutil create` 在某些环境（如 Agent 沙箱）被禁用，DMG 打不出来；
# 而且发布产物本就不该在开发机上随手构建。这条 workflow 让「下载一个 dmg」成立。
#
# 触发方式：
#   推 tag   ：git tag v0.2.0 && git push origin v0.2.0   → 构建 + 直接建 Release
#   手动触发 ：Actions 页面 Run workflow，可只构建不上 Release（产物进 artifacts）
#
# 版本来源（三选一，优先级从高到低）：
#   1. workflow_dispatch 填的 version
#   2. tag 名去掉 v 前缀
#   3. apps/desktop/package.json 里现有的版本

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，例如 0.2.0）。留空则用 tag 或包内版本。'
        required: false
        type: string

permissions:
  contents: write # 创建 Release、上传产物

jobs:
  build-macos-dmg:
    runs-on: macos-latest # 与 ci.yml 保持一致；runner 上有 hdiutil，能打 DMG
    # 版本号产给下游 publish job（artifact 名与 cask 版本都靠它）
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (root / web / desktop)
        run: |
          npm ci
          npm ci --prefix web
          npm ci --prefix apps/desktop

      # 别让带病的代码进发布包：先跑与 ci.yml 同级的检查
      - name: Type check
        run: npx tsc --noEmit

      - name: Lint & format check (Biome)
        run: npx biome check .

      - name: Deterministic test suites (no LLM)
        run: npm run test:all

      - name: Resolve release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          elif [ -n "$TAG_NAME" ] && [ "${TAG_NAME#v}" != "$TAG_NAME" ]; then
            V="${TAG_NAME#v}"          # v0.2.0 → 0.2.0
          else
            V="$(node -p "require('./apps/desktop/package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "→ 发布版本：$V"

      - name: Sync version into desktop package
        run: cd apps/desktop && PAYASO_RELEASE_VERSION=${{ steps.version.outputs.version }} node scripts/sync-version.mjs

      # 取官方 Node 运行时 + 生成图标 + 组装后端整体（需要网络）
      - name: Prepare desktop payload
        run: npm run desktop:setup

      - name: Package DMG & ZIP
        # 签名/公证凭据从 secrets 传入。注意：secret 未配时 GitHub Actions 展开成**空串**，
        # 而 electron-builder 的 getCscLink 对空串照单全收（chooseNotNull 不判空），随后
        # resolveCscLinkPath('') 解析成当前目录，报 "<目录> not a file"（坑 8，本地已复现）。
        # 所以必须把空变量彻底 unset —— "没配凭据"才真正等于"跳过签名"。
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD \
                   APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -z "$CSC_LINK" ]; then
            # 没配证书就明确不签名，不赌 runner 钥匙串里有什么
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run desktop:dmg

      # 自更新 feed 的硬门禁：配了 publish 才会写 app-update.yml / latest-*.yml，
      # 少任何一个都是"用户永远查不到更新"的静默故障。放在上传**之前**：这一版坏了
      # 就连 artifact 都不产出 → 下游 publish job（needs 两个平台）不跑 → 不会出现
      # "只有 Windows"的半成品 Release（v0.4.7 的教训）。
      - name: Verify updater feed
        run: |
          set -euo pipefail
          # 解包目录名随 runner 架构变（mac-arm64 / mac / mac-universal）—— 用 glob 找，别写死
          APP_CONFIG=$(ls -d apps/desktop/release/mac*/PayasoAgent.app/Contents/Resources/app-update.yml 2>/dev/null | head -1 || true)
          if [ -z "$APP_CONFIG" ]; then
            echo "::error::缺少 app-update.yml —— publish 没生效（或打包没走到最后）"
            echo "--- release/ 现状 ---"; ls -la apps/desktop/release || true
            echo "--- 目录内找 app-update.yml ---"; find apps/desktop/release -maxdepth 5 -name 'app-update.yml' || true
            exit 1
          fi
          grep -q 'provider: github' "$APP_CONFIG" || { echo "::error::app-update.yml 的 provider 不是 github"; cat "$APP_CONFIG"; exit 1; }
          echo "--- $APP_CONFIG ---"; cat "$APP_CONFIG"
          test -f apps/desktop/release/latest-mac.yml || { echo "::error::缺少 latest-mac.yml —— updater 拿不到 feed"; ls -la apps/desktop/release; exit 1; }
          head -20 apps/desktop/release/latest-mac.yml

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PayasoAgent-${{ steps.version.outputs.version }}-macOS
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    # 版本号产给下游 publish job（artifact 名与 cask 版本都靠它）
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash # 步骤脚本是 bash 语法（runner 自带 Git Bash）
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (root / web / desktop)
        run: |
          npm ci
          npm ci --prefix web
          npm ci --prefix apps/desktop

      - name: Type check
        run: npx tsc --noEmit

      - name: Resolve release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          elif [ -n "$TAG_NAME" ] && [ "${TAG_NAME#v}" != "$TAG_NAME" ]; then
            V="${TAG_NAME#v}"          # v0.3.0 → 0.3.0
          else
            V="$(node -p "require('./apps/desktop/package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "→ 发布版本：$V"

      - name: Sync version into desktop package
        run: cd apps/desktop && PAYASO_RELEASE_VERSION=${{ steps.version.outputs.version }} node scripts/sync-version.mjs

      # 拆成三段跑：哪段挂，注解的步号直接定位（别再合成一步瞎猜）
      - name: 'Prep 1/3: fetch Node runtime'
        working-directory: apps/desktop
        run: node scripts/fetch-node.mjs

      - name: 'Prep 2/3: app icon (mac-only, skips on win)'
        working-directory: apps/desktop
        run: node scripts/make-icon.mjs

      - name: 'Prep 3/3: stage backend payload'
        working-directory: apps/desktop
        run: node scripts/stage-backend.mjs

      - name: Package NSIS installer & ZIP
        # WIN_CSC_* 为空也必须 unset —— 坑 8 的空串陷阱 Windows 同款
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          for v in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -n "${!v}" ] || unset "$v"
          done
          npm run desktop:win

      # 自更新 feed 的硬门禁：配了 publish 才会写 app-update.yml / latest-*.yml，
      # 少任何一个都是"用户永远查不到更新"的静默故障。放在上传**之前**：这一版坏了
      # 就连 artifact 都不产出 → 下游 publish job（needs 两个平台）不跑 → 不会出现
      # "只有 Windows"的半成品 Release（v0.4.7 的教训）。
      - name: Verify updater feed
        run: |
          set -euo pipefail
          # 解包目录名不写死，失败时打印现场
          APP_CONFIG=$(ls -d apps/desktop/release/win-unpacked/resources/app-update.yml 2>/dev/null | head -1 || true)
          if [ -z "$APP_CONFIG" ]; then
            echo "::error::缺少 app-update.yml —— publish 没生效（或打包没走到最后）"
            echo "--- release/ 现状 ---"; ls -la apps/desktop/release || true
            echo "--- 目录内找 app-update.yml ---"; find apps/desktop/release -maxdepth 5 -name 'app-update.yml' || true
            exit 1
          fi
          grep -q 'provider: github' "$APP_CONFIG" || { echo "::error::app-update.yml 的 provider 不是 github"; cat "$APP_CONFIG"; exit 1; }
          echo "--- $APP_CONFIG ---"; cat "$APP_CONFIG"
          test -f apps/desktop/release/latest.yml || { echo "::error::缺少 latest.yml —— updater 拿不到 feed"; ls -la apps/desktop/release; exit 1; }
          head -20 apps/desktop/release/latest.yml

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PayasoAgent-${{ steps.version.outputs.version }}-Windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  # 统一发布：两个平台都成功才建 Release（Windows + macOS 必须同一版本，不接受
  # "只有 Windows"的半成品 —— v0.4.7 就是这么来的）。两个 build job 只产 artifact，
  # 本 job 用 needs 卡住：任一平台失败 → 这里不跑 → 无半成品 Release，cask 也不 bump。
  publish:
    needs: [build-macos-dmg, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # 手动触发只出 artifact，不发版
    steps:
      - uses: actions/checkout@v4

      - name: Download both platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # 统一版本的硬门禁：两平台安装包 + 两条 feed 必须同时在，且版本号一致。
      - name: Verify unified asset set
        run: |
          set -euo pipefail
          echo "--- 收到的资产 ---"; ls -la release-assets
          missing=0
          for pattern in 'PayasoAgent-*-arm64.dmg' 'PayasoAgent-*-arm64-mac.zip' \
                         'PayasoAgent-*-setup.exe' 'PayasoAgent-*-x64.zip' \
                         'latest-mac.yml' 'latest.yml'; do
            if ! ls release-assets/${pattern} >/dev/null 2>&1; then
              echo "::error::缺 ${pattern} —— 两个平台没齐，拒绝发布"; missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          VERSION="${{ needs.build-macos-dmg.outputs.version }}"
          grep -q "^version: ${VERSION}$" release-assets/latest-mac.yml || { echo "::error::latest-mac.yml 版本不是 ${VERSION}"; exit 1; }
          grep -q "^version: ${VERSION}$" release-assets/latest.yml || { echo "::error::latest.yml 版本不是 ${VERSION}"; exit 1; }
          echo "两个平台 feed 版本一致：${VERSION}"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PayasoAgent ${{ needs.build-macos-dmg.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true

      # Homebrew cask 自动 bump：改 version + DMG 的 sha256 后推回 main。
      - name: Sync Homebrew cask
        env:
          VERSION: ${{ needs.build-macos-dmg.outputs.version }}
        run: |
          DMG_SHA=$(shasum -a 256 release-assets/*.dmg | awk '{print $1}')
          git fetch origin main
          git checkout -B main origin/main
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/payasoagent.rb
          sed -i -E "s/^  sha256 \".*\"/  sha256 \"${DMG_SHA}\"/" Casks/payasoagent.rb
          git add Casks/payasoagent.rb
          if git diff --cached --quiet; then
            echo "cask 无变化"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(cask): bump payasoagent to ${VERSION}"
            git push origin main
          fi
